<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#0f172a"/>
  
  <!-- Orbital ellipses -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="url(#orbGrad)" stroke-width="4" transform="rotate(-30 256 256)" opacity="0.9"/>
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="url(#orbGrad)" stroke-width="4" transform="rotate(30 256 256)" opacity="0.9"/>
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="url(#orbGrad)" stroke-width="4" transform="rotate(90 256 256)" opacity="0.9"/>
  
  <!-- Network connections -->
  <line x1="160" y1="200" x2="256" y2="160" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="200" x2="256" y2="160" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="312" x2="256" y2="352" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="312" x2="256" y2="352" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="200" x2="160" y2="312" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="200" x2="352" y2="312" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="256" x2="256" y2="256" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="256" x2="256" y2="256" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="160" x2="256" y2="256" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="352" x2="256" y2="256" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  
  <!-- Outer nodes -->
  <circle cx="160" cy="200" r="10" fill="url(#nodeGrad)"/>
  <circle cx="352" cy="200" r="10" fill="url(#nodeGrad)"/>
  <circle cx="160" cy="312" r="10" fill="url(#nodeGrad)"/>
  <circle cx="352" cy="312" r="10" fill="url(#nodeGrad)"/>
  <circle cx="256" cy="160" r="12" fill="url(#nodeGrad)"/>
  <circle cx="256" cy="352" r="12" fill="url(#nodeGrad)"/>
  
  <!-- Mid nodes -->
  <circle cx="208" cy="208" r="7" fill="url(#nodeGrad)" opacity="0.8"/>
  <circle cx="304" cy="208" r="7" fill="url(#nodeGrad)" opacity="0.8"/>
  <circle cx="208" cy="304" r="7" fill="url(#nodeGrad)" opacity="0.8"/>
  <circle cx="304" cy="304" r="7" fill="url(#nodeGrad)" opacity="0.8"/>
  
  <!-- Center core -->
  <circle cx="256" cy="256" r="24" fill="url(#coreGrad)"/>
  <circle cx="256" cy="256" r="12" fill="#67e8f9" opacity="0.8"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff" opacity="0.6"/>
</svg>
